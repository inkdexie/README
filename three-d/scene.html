<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园助手 - 校园三维导览</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    body { margin: 0; overflow: hidden; }
    .scene-nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 9999;
    }
    .scene-tip {
      position: fixed;
      left: 12px;
      bottom: 12px;
      z-index: 9999;
      font-size: 13px;
    }
    a-scene { position: absolute; top: 0; }
  </style>
  <script src="libs/aframe.min.js"></script>
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-dark scene-nav" aria-label="主导航">
    <div class="container">
      <a class="navbar-brand" href="../index.html">校园助手</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="展开导航">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="../study.html">自习室</a></li>
          <li class="nav-item"><a class="nav-link" href="../stats.html">统计</a></li>
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="scene.html">校园三维</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <a-scene vr-mode-ui="enabled: false">
    <a-sky color="#aee3f7"></a-sky>
    <a-plane position="0 0 -4" rotation="-90 0 0" width="20" height="20" color="#7cb342"></a-plane>

    <a-box position="0 1.2 -6" width="4" height="2.4" depth="2" color="#efeeee"></a-box>
    <a-box position="0 2.7 -6" width="4.4" height="0.4" depth="2.4" color="#b71c1c"></a-box>

    <a-cylinder position="3 1.8 -5" radius="0.05" height="3.6" color="#9e9e9e"></a-cylinder>
    <a-box position="3.35 3.3 -5" width="0.7" height="0.45" depth="0.03" color="#e53935"
           animation="property: position; to: 3.4 3.3 -5; dir: alternate; dur: 900; loop: true">
    </a-box>

    <a-cylinder position="-3 1.2 -4" radius="0.06" height="2.4" color="#616161"></a-cylinder>
    <a-sphere position="-3 2.5 -4" radius="0.18" color="#fff59d"
              animation="property: scale; to: 1.3 1.3 1.3; dir: alternate; dur: 1200; loop: true">
    </a-sphere>
    <a-light type="point" position="-3 2.6 -4" color="#fff59d" intensity="0.6"></a-light>

    <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>

    <a-camera position="0 1.8 2" look-controls wasd-controls></a-camera>
  </a-scene>

  <p class="scene-tip badge text-bg-light text-dark">拖拽旋转视角 · WASD 移动 · 点导航可返回各模块</p>

  <script src="../libs/bootstrap.bundle.min.js"></script>
</body>
</html>
