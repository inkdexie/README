<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方块世界</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/mywork.css">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-dark sticky-top mw-nav" aria-label="主导航">
    <div class="container">
      <a class="navbar-brand" href="index.html">方块世界</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="展开导航">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#stage">展台</a></li>
          <li class="nav-item"><a class="nav-link" href="#board-section">物品看板</a></li>
          <li class="nav-item"><a class="nav-link" href="#plan-section">任务说明</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container">
    <header class="text-center pt-4 pb-2">
      <h1 class="h3">方块世界</h1>
      <p class="text-secondary mb-0">三维展台 · 物品栏切换 · 物品看板 · 属性图表</p>
    </header>

    <section class="mw-stage" id="stage" aria-label="三维展台区域">
      <span class="mw-stage-tag">三维展台（进阶模块）</span>
      <div class="mw-placeholder">此处将放置 Three.js 三维场景：方块小人与四件道具</div>
    </section>

    <div class="mw-hotbar" id="hotbar" role="group" aria-label="物品栏">
      <div class="mw-slot active">1 道具一</div>
      <div class="mw-slot">2 道具二</div>
      <div class="mw-slot">3 道具三</div>
      <div class="mw-slot">4 道具四</div>
    </div>
    <p class="mw-tip">按数字键 1-4 切换手中物品 · 点击三维物品或物品栏查看看板</p>

    <section class="mw-section" id="board-section" aria-label="物品看板区域">
      <h2 class="mb-3">物品看板</h2>
      <div class="mw-placeholder-line">点击任意物品后，此处展示物品图片、游戏简介与属性图表（占位）</div>
    </section>

    <section class="mw-section" id="plan-section" aria-label="任务说明区域">
      <h2 class="mb-3">任务分解 · 时间表 · 风险清单</h2>
      <div class="mw-placeholder-line">任务分工与风险记录（占位，后续补充）</div>
    </section>
  </main>

  <footer>
    <p>方块世界 · 我的世界风格原创模型作业（非官方、非素材搬运）</p>
  </footer>

  <script src="libs/jquery-3.7.1.min.js"></script>
  <script src="libs/bootstrap.bundle.min.js"></script>
</body>
</html>
