<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方块世界</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/mywork.css">
</head>
<body>
  <nav class="navbar navbar-expand-md navbar-dark bg-dark sticky-top mw-nav" aria-label="主导航">
    <div class="container">
      <a class="navbar-brand" href="index.html">方块世界</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="展开导航">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#stage">展台</a></li>
          <li class="nav-item"><a class="nav-link" href="#board-section">物品看板</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container">
    <header class="text-center pt-4 pb-2">
      <h1 class="h3">方块世界</h1>
      <p class="text-secondary mb-0">三维展台 · 物品栏切换 · 物品看板 · 属性图表</p>
    </header>

    <section class="mw-stage" id="stage" aria-label="三维展台区域">
      <span class="mw-stage-tag">三维展台</span>
      <div class="mw-placeholder">
        <div>
          <p class="mb-2">此处将放置 Three.js 三维场景：方块小人与四件道具</p>
          <p class="mb-0 fs-6">手中物品：<span id="held-name"></span></p>
        </div>
      </div>
    </section>

    <div id="load-status" class="alert alert-warning mb-3 text-center">加载中...</div>

    <div id="hotbar-wrap" class="d-none">
      <div class="mw-hotbar" id="hotbar" role="group" aria-label="物品栏"></div>
      <p class="mw-tip">按数字键 1-4 切换手中物品 · 点击物品栏查看看板 · 拖拽旋转视角 · 滚轮缩放 · 右键平移</p>
    </div>

    <section class="mw-section" id="board-section" aria-label="物品看板区域">
      <h2 class="mb-3">物品看板</h2>
      <div class="mw-placeholder-line">点击任意物品后，看板弹窗展示物品图片与游戏简介（占位）</div>
    </section>
  </main>

  <div class="modal fade" id="itemModal" tabindex="-1" aria-labelledby="board-name" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="board-name"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭"></button>
        </div>
        <div class="modal-body">
          <div class="text-center mb-3">
            <img id="board-img" class="mw-board-img" alt="" src="">
            <p class="text-muted small mt-2 mb-0">物品序号 <span id="board-index"></span> / 4 · 图片为自制三维模型截图</p>
          </div>
          <p id="board-desc"></p>
          <div class="mw-chart-box"><canvas id="stat-chart" role="img" aria-label="物品属性对比柱状图"></canvas></div>
          <p class="text-muted small mt-2 mb-0" id="board-source"></p>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <p>方块世界 · 我的世界风格原创模型作业</p>
  </footer>

  <script src="libs/jquery-3.7.1.min.js"></script>
  <script src="libs/bootstrap.bundle.min.js"></script>
  <script src="libs/chart.umd.js"></script>
  <script src="libs/three.min.js"></script>
  <script src="libs/OrbitControls.js"></script>
  <script src="js/scene.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
